# A release published on GitHub gets its download here: it is built from the source of its tag and attached to it.
# Run by hand (Actions > Release > Run workflow) it only builds it, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # the icons of the skin are drawn from Segoe Fluent Icons (part of Windows 11, not always of Windows Server)
      - name: Segoe Fluent Icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          if ((New-Object System.Drawing.Text.InstalledFontCollection).Families.Name -contains 'Segoe Fluent Icons') { exit 0 }
          Invoke-WebRequest https://aka.ms/SegoeFluentIcons -OutFile "$env:RUNNER_TEMP\fluent.zip"
          Expand-Archive "$env:RUNNER_TEMP\fluent.zip" "$env:RUNNER_TEMP\fluent"
          Add-Type -Namespace Native -Name Gdi -MemberDefinition '[DllImport("gdi32.dll", CharSet = CharSet.Unicode)] public static extern int AddFontResource(string file);'
          Get-ChildItem "$env:RUNNER_TEMP\fluent" -Recurse -Filter *.ttf | ForEach-Object {
            Copy-Item $_.FullName "$env:WINDIR\Fonts\$($_.Name)" -Force
            New-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts' -Name "$($_.BaseName) (TrueType)" -Value $_.Name -Force | Out-Null
            [Native.Gdi]::AddFontResource("$env:WINDIR\Fonts\$($_.Name)") | Out-Null
          }

      - name: Build the skins zip
        shell: pwsh
        run: ./release.ps1

      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: HeMiDark
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/dist/HeMiDark-Skins.zip build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
